services:
  # ───────────────────────── VPN ─────────────────────────
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - TZ=${TZ}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16
      - DNS_ADDRESS=127.0.0.11
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      - "8000:8000/tcp"
      - "9696:9696"
      - "8191:8191"
      - "8888:8888/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://1.1.1.1 || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks: [vpn, media]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────── Arrs on LAN ─────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK_SET=022
    volumes:
      - ./config/sonarr:/config
      - ${NAS_ROOT}/plex-library/tv:/tv
      - ${NAS_ROOT}/raw-downloads/usenet:/downloads
    ports:
      - "8989:8989"
    networks: [media]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK_SET=022
    volumes:
      - ./config/radarr:/config
      - ${NAS_ROOT}/plex-library/movies:/movies
      - ${NAS_ROOT}/raw-downloads/usenet:/downloads
    ports:
      - "7878:7878"
    networks: [media]
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - ${NAS_ROOT}/plex-library/movies:/movies
      - ${NAS_ROOT}/plex-library/tv:/tv
    ports:
      - "6767:6767"
    networks: [media]
    restart: unless-stopped

  # ───────────────────────── Usenet ─────────────────────────
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sabnzbd:/config
      - ${NAS_ROOT}/raw-downloads/usenet:/downloads
      - ${NAS_ROOT}/raw-downloads/usenet/incomplete:/incomplete-downloads
      - ${NAS_ROOT}/plex-library/tv:/tv
      - ${NAS_ROOT}/plex-library/movies:/movies
    ports:
      - "8085:8080"
    networks: [media]
    restart: unless-stopped

  # ───────────────────────── Quality Management ─────────────────────────
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - TZ=${TZ}
      - RECYCLARR_CREATE_CONFIG=true
    volumes:
      - ./config/recyclarr:/config
    networks: [media]
    restart: unless-stopped

  # ───────────────────────── Dashboard ─────────────────────────
  homer:
    image: b4bz/homer:latest
    container_name: homer
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - INIT_ASSETS=1
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ./config/homer:/www/assets
    ports:
      - "8081:8080"
    networks: [media]
    restart: unless-stopped

  # ───────────────────────── Updates ─────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      - WATCHTOWER_SCHEDULE=0 0 2 * * MON
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_REMOVE_VOLUMES=false
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_WARN_ON_HEAD_FAILURE=always
      - WATCHTOWER_TIMEOUT=10s
    ports:
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [monitoring]
    restart: unless-stopped

  # ───────────────────────── Monitoring ─────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=2GB"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - TZ=${TZ}
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana:/etc/grafana
      - grafana-data:/var/lib/grafana
    networks: [monitoring]
    depends_on: [prometheus]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8083:8080"
    networks: [monitoring]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./config/alertmanager:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks: [monitoring]
    restart: unless-stopped

  # ───────────────────────── OpenClaw Core (Phase 1) ─────────────────────────
  openclaw:
    image: alpine/openclaw:latest
    container_name: openclaw
    user: "${PUID}:${PGID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    env_file:
      - ./secrets/openclaw.env
    environment:
      - NODE_ENV=production
      - TZ=${TZ}
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - NO_PROXY=localhost,127.0.0.1,litellm,citadel,openshell,browser,proxy
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:3007:3007"
    volumes:
      - ./config/openclaw:/home/node/.openclaw
      - ./workspace/openclaw:/home/node/workspace
    networks: [agent]
    depends_on:
      - litellm
      - citadel
      - openshell
      - browser
      - proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - ./secrets/litellm.env
    environment:
      - TZ=${TZ}
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - NO_PROXY=localhost,127.0.0.1,openclaw,citadel,openshell,browser,proxy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    networks: [agent]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  openshell:
    image: ghcr.io/nvidia/openshell:latest
    container_name: openshell
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/openshell/policies.yaml:/etc/openshell/policies.yaml:ro
      - ./workspace/openclaw:/mnt/workspace
    expose:
      - "50051"
    networks: [agent]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  citadel:
    image: ghcr.io/trymightyai/citadel:latest
    container_name: citadel
    command: ["--port", "3333"]
    environment:
      - TZ=${TZ}
      - CITADEL_AUTO_DOWNLOAD_MODEL=true
      - CITADEL_ENABLE_HUGOT=true
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - NO_PROXY=localhost,127.0.0.1,openclaw,litellm,openshell,browser,proxy
    volumes:
      - ./config/citadel-cache:/root/.cache/huggingface
    expose:
      - "3333"
    networks: [agent]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  browser:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    container_name: browser
    command: npx playwright run-server --port 3000 --host 0.0.0.0
    environment:
      - TZ=${TZ}
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - NO_PROXY=localhost,127.0.0.1,openclaw,litellm,citadel,openshell,browser,proxy
    shm_size: "1g"
    networks: [agent]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: ubuntu/squid:latest
    container_name: proxy
    volumes:
      - ./config/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - agent
      - egress
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  prometheus-data:
  grafana-data:

networks:
  media:
    driver: bridge
  vpn:
    driver: bridge
  monitoring:
    driver: bridge
  agent:
    driver: bridge
    internal: true
  egress:
    driver: bridge
